
name: 司机社每日自动签到

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 08:20
    - cron: "20 0 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 检查账号配置
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          try:
              accounts = json.loads(
                  os.environ.get("ACCOUNTS_JSON", "")
              )
              if not isinstance(accounts, list) or not accounts:
                  raise ValueError("账号列表为空")
              for account in accounts:
                  if not account.get("username") or not account.get("password"):
                      raise ValueError("账号或密码缺失")
              print(f"账号配置正常，共 {len(accounts)} 个账号")
          except Exception as e:
              print(f"::error::账号配置错误：{e}")
              sys.exit(1)
          PY

      - name: Playwright 自动登录并签到
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          PYTHONUNBUFFERED: "1"
        run: |
          python playwright_checkin.py

      - name: 任务执行完成
        if: success()
        run: |
          echo "司机社自动签到任务成功结束"
