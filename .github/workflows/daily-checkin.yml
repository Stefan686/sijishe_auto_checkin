
name: 司机社每日自动签到

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:20 自动执行
    - cron: "20 0 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 获取仓库代码
      - name: 获取代码
        uses: actions/checkout@v4

      # 2. 安装 Rust
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 检查网站访问情况
      - name: 诊断网站访问状态
        shell: bash
        run: |
          for path in "/" "/home.php?mod=space" "/k_misign-sign.html"; do
            echo "===== 检查 $path ====="

            curl -L -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -o /dev/null \
              -w 'HTTP状态码: %{http_code}\n最终地址: %{url_effective}\n' \
              "https://xsijishe.com$path" || true

            echo "------------------------"
          done

      # 4. 配置司机社账号
      - name: 配置登录账号
        shell: bash
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          if [ -z "$ACCOUNTS_JSON" ]; then
            echo "::error::未设置 ACCOUNTS_JSON"
            exit 1
          fi

          mkdir -p ~/.config/sijishe

          printf '%s' "$ACCOUNTS_JSON" \
            > ~/.config/sijishe/accounts.json

          chmod 600 ~/.config/sijishe/accounts.json

          echo "账号配置文件已生成"

      # 5. 编译并执行签到
      - name: 编译并执行签到
        shell: bash
        run: |
          set -o pipefail

          cargo run --release -- checkin 2>&1 | tee checkin.log

          # 检测已知错误
          if grep -Eiq \
            "Error processing|Login failed|Check-in failed|No accounts found|Just a moment" \
            checkin.log; then

            echo "::error::司机社签到失败，请检查网站登录或安全验证"
            exit 1
          fi

          # 检测成功信息
          if grep -Eq \
            "Check-in successful!|Already checked in today." \
            checkin.log; then

            echo "司机社签到成功或今日已签到"

          else
            echo "::error::未检测到明确的签到成功信息"
            exit 1
          fi

      # 6. 输出执行结果
      - name: 完成签到任务
        if: success()
        run: |
          echo "司机社每日签到任务执行成功"
